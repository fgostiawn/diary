<!doctype html>
<html lang="id" data-design="{{ID}}" data-mode="{{MODE}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}}</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="{{DESC}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Montserrat:wght@400;500;600;700&family=Pinyon+Script{{FONTS}}&display=swap">
<style id="page-size">@page{size:A4 {{PAGESIZE}};margin:0}</style>
<style>
{{ENGINE_CSS}}
/* ===== desain: {{TITLE}} ===== */
{{DESIGN_CSS}}
</style>
</head>
<body>

<header class="bar">
  <div class="brand"><a class="back" href="../index.html" data-back aria-label="Kembali ke pilihan desain">&#8592;</a><b>{{TITLE}}</b><span>{{SUB}}</span></div>
  <div class="tools">
    <div class="seg" role="group" aria-label="Orientasi kertas">
      <button class="btn" id="m-land" type="button" aria-pressed="false">Lanskap · 2 hal/lembar</button>
      <button class="btn" id="m-port" type="button" aria-pressed="false">Potret · 1 hal/lembar</button>
    </div>
    <button class="btn" id="t-edit" type="button" aria-pressed="false">Mode edit</button>
    <button class="btn edit-only" id="b-many" type="button">Isi banyak foto</button>
    <button class="btn" id="b-share" type="button" data-top-only>Bagikan file</button>
    <button class="btn primary" id="b-print" type="button" data-top-only>Cetak / PDF</button>
    <button class="btn warn edit-only" id="b-reset" type="button">Reset</button>
    <span class="status" id="status" aria-live="polite"></span>
  </div>
</header>

<main class="book" id="book" lang="id">
{{PAGES}}
</main>

<input type="file" id="file-one" accept="image/*" hidden>
<input type="file" id="file-cam" accept="image/*" capture="environment" hidden>
<input type="file" id="file-many" accept="image/*" multiple hidden>
<div class="menu" id="menu" hidden>
  <div class="menu-card" role="dialog" aria-modal="true" aria-labelledby="menu-title">
    <p class="menu-title" id="menu-title">Foto</p>
    <button class="mbtn" type="button" data-act="gallery">Pilih dari galeri</button>
    <button class="mbtn" type="button" data-act="camera">Ambil dengan kamera</button>
    <button class="mbtn" type="button" data-act="pan" data-has>Atur posisi foto</button>
    <button class="mbtn danger" type="button" data-act="remove" data-has>Hapus foto</button>
    <button class="mbtn ghost" type="button" data-act="cancel">Batal</button>
  </div>
</div>
<button class="btn primary pan-done" id="pan-done" type="button" hidden>Selesai atur posisi</button>
<div class="toast" id="toast" role="status"></div>

<script id="sb-data" type="application/json">null</script>
<script>
{{ENGINE_JS}}
</script>
</body>
</html>
