    el.addEventListener("pointermove", e => {
      if (!start) return;
      const ph = p.photos[key];
      ph.x = clamp(start.ox - (e.clientX - start.x) / start.w * 100, 0, 100);
      ph.y = clamp(start.oy - (e.clientY - start.y) / start.h * 100, 0, 100);
      const img = el.querySelector("img");
      if (img) img.style.objectPosition = `${ph.x}% ${ph.y}%`;
    });
    const end = () => { if (start) { start = null; el.classList.remove("panning"); save(); } };
    el.addEventListener("pointerup", end);
    el.addEventListener("pointercancel", end);
  }

  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const fileInput = document.getElementById("fileInput");
  let pickTarget = null;
  function pickFile(el, p) { pickTarget = { el, page: p }; fileInput.value = ""; fileInput.click(); }
  fileInput.addEventListener("change", () => {
    const f = fileInput.files[0];
    if (f && pickTarget) putImage(f, pickTarget.el, pickTarget.page);
  });

  async function putImage(blob, el, p) {
    el.insertAdjacentHTML("beforeend", '<div class="loading">Memuat…</div>');
    try {
      const src = await compress(blob);
      p.photos[el.dataset.slot] = { src, x: 50, y: 50 };
      paintSlot(el, p);
      setActive(el, p);
      burst(el);
      save();
    } catch {
      el.querySelector(".loading")?.remove();
      toast("Gambar tidak bisa dibuka. Coba format JPG atau PNG.");
    }
  }

  // Resize big photos so the book stays light in storage.
  function compress(blob, max = 1800) {
    return new Promise((res, rej) => {
      const url = URL.createObjectURL(blob);
      const img = new Image();
      img.onload = () => {
        const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
        const c = document.createElement("canvas");
        c.width = Math.round(img.naturalWidth * s);
        c.height = Math.round(img.naturalHeight * s);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        res(c.toDataURL("image/jpeg", .88));
      };
      img.onerror = () => { URL.revokeObjectURL(url); rej(); };
      img.src = url;
    });
  }

  // Paste image from clipboard -> active slot, or first empty slot
  const hasImage = dt => dt && [...dt.items].some(i => i.kind === "file" && i.type.startsWith("image/"));
  document.addEventListener("paste", e => {
    if (mode !== "edit") return;
    const item = e.clipboardData && [...e.clipboardData.items].find(i => i.kind === "file" && i.type.startsWith("image/"));
    if (!item) return;
    e.preventDefault();
    let target = activeSlot && document.body.contains(activeSlot.el) ? activeSlot : null;
    if (!target) {
      for (const s of document.querySelectorAll("[data-slot]")) {
        const page = state.pages.find(pg => pg.id === s.closest(".sheet").dataset.id);
        if (!page.photos[s.dataset.slot]) { target = { el: s, page }; break; }
      }
    }
    if (!target) { toast("Klik dulu kotak foto yang ingin diisi, lalu tempel lagi."); return; }
    putImage(item.getAsFile(), target.el, target.page);
    target.el.scrollIntoView({ behavior: "smooth", block: "center" });
  });
  document.addEventListener("click", e => { if (!e.target.closest(".slot")) setActive(null); });

  /* ================= Page actions ================= */
  book.addEventListener("click", e => {
    const b = e.target.closest("[data-act]");
    if (!b) return;
    const id = b.closest(".sheet").dataset.id;
    const i = state.pages.findIndex(p => p.id === id);
    const act = b.dataset.act;
    if (act === "up" && i > 0) [state.pages[i - 1], state.pages[i]] = [state.pages[i], state.pages[i - 1]];
    else if (act === "down" && i < state.pages.length - 1) [state.pages[i + 1], state.pages[i]] = [state.pages[i], state.pages[i + 1]];
    else if (act === "dup") state.pages.splice(i + 1, 0, { ...JSON.parse(JSON.stringify(state.pages[i])), id: uid() });
    else if (act === "del") {
      if (state.pages.length <= 1) { toast("Buku minimal punya satu halaman."); return; }
      askConfirm("Hapus halaman ini?", "Foto dan tulisan di halaman ini ikut terhapus.", "Hapus").then(ok => {
        if (!ok) return;
        const j = state.pages.findIndex(p => p.id === id);
        if (j > -1) { state.pages.splice(j, 1); render(); save(); }
      });
      return;
    }
    render(); save();
  });

  // Template picker
  const modal = document.getElementById("tplModal");
  const tplGrid = document.getElementById("tplGrid");
  tplGrid.innerHTML = Object.entries(TEMPLATES).map(([k, t]) =>
    `<button class="tpl" data-tpl="${k}"><div class="mini">${t.icon}</div><b>${t.name}</b></button>`).join("");
  document.getElementById("btnAdd").onclick = () => modal.classList.add("open");
  document.getElementById("tplClose").onclick = () => modal.classList.remove("open");
  modal.addEventListener("click", e => { if (e.target === modal) modal.classList.remove("open"); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") { modal.classList.remove("open"); shareModal.classList.remove("open"); cModal.classList.contains("open") && document.getElementById("confirmNo").click(); } });
  tplGrid.addEventListener("click", e => {
    const b = e.target.closest("[data-tpl]");
    if (!b) return;
    const pg = newPage(b.dataset.tpl);
    const lastIsEnd = state.pages.length && state.pages[state.pages.length - 1].type === "end";
    state.pages.splice(lastIsEnd ? state.pages.length - 1 : state.pages.length, 0, pg);
    modal.classList.remove("open");
    render(); save();
    const el = book.querySelector(`[data-id="${pg.id}"]`);
    if (el) { el.classList.add("new"); el.scrollIntoView({ behavior: "smooth", block: "center" }); }
  });

  /* ================= Confirm dialog (native confirm() is blocked in some viewers) ================= */
  const cModal = document.getElementById("confirmModal");
  function askConfirm(msg, sub, yesLabel) {
    document.getElementById("confirmMsg").textContent = msg;
    document.getElementById("confirmSub").textContent = sub || "";
    document.getElementById("confirmYes").textContent = yesLabel || "Ya, lanjut";
    cModal.classList.add("open");
    return new Promise(res => {
      const done = v => { cModal.classList.remove("open"); cModal.onclick = null; res(v); };
      document.getElementById("confirmYes").onclick = () => done(true);
      document.getElementById("confirmNo").onclick = () => done(false);
      cModal.onclick = e => { if (e.target === cModal) done(false); };
    });
  }

  /* ================= Bulk add from phone gallery / camera ================= */
  const bulkInput = document.getElementById("bulkInput");
  document.getElementById("btnBulk").onclick = () => { bulkInput.value = ""; bulkInput.click(); };
  bulkInput.addEventListener("change", async () => {
    const files = [...bulkInput.files].filter(f => f.type.startsWith("image/") || /\.(heic|heif)$/i.test(f.name));
    if (!files.length) return;
    const slotKeys = type => { // slot order as it appears in the template
      const d = document.createElement("div"); d.innerHTML = TEMPLATES[type].html();
      return [...d.querySelectorAll("[data-slot]")].map(s => s.dataset.slot);
    };
    const nextEmpty = () => {
      for (const pg of state.pages) for (const k of slotKeys(pg.type)) if (!pg.photos[k]) return { pg, k };
      // book is full: add a collage page before the closing page
      const pg = newPage("collage");
      const lastIsEnd = state.pages[state.pages.length - 1]?.type === "end";
      state.pages.splice(lastIsEnd ? state.pages.length - 1 : state.pages.length, 0, pg);
      return { pg, k: slotKeys("collage")[0] };
    };
    let ok = 0, firstId = null;
    for (let n = 0; n < files.length; n++) {
      toast(`Memproses foto ${n + 1} dari ${files.length}…`);
      try {
        const src = await compress(files[n]);
        const t = nextEmpty();
        t.pg.photos[t.k] = { src, x: 50, y: 50 };
        firstId = firstId || t.pg.id;
        ok++;
      } catch { /* skip unreadable file */ }
    }
    render(); save();
    toast(ok === files.length ? `${ok} foto berhasil ditambahkan ♥` : `${ok} dari ${files.length} foto berhasil ditambahkan. Sisanya formatnya tidak didukung.`);
    const el = firstId && book.querySelector(`[data-id="${firstId}"]`);
    if (el) { el.scrollIntoView({ behavior: "smooth", block: "start" }); setTimeout(() => burst(el.querySelector(".page")), 500); }
  });

  /* ================= Toolbar ================= */
  try { if (window.self !== window.top) document.documentElement.classList.add("framed"); }
  catch { document.documentElement.classList.add("framed"); }
  document.getElementById("btnPrint").onclick = () => window.print();

  document.getElementById("btnReset").onclick = () => {
    askConfirm("Kembalikan ke template awal?", "Semua foto & tulisan akan dihapus.", "Reset").then(ok => {
      if (!ok) return;
      state = freshBook(); render(); save(); toast("Template dikembalikan ke awal.");
    });
  };

  document.getElementById("btnBackup").onclick = () => {
    const blob = new Blob([JSON.stringify(state)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "book-of-us.json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    toast("Cadangan diunduh. Simpan file ini baik-baik ♥");
  };

  const restoreInput = document.getElementById("restoreInput");
  document.getElementById("btnRestore").onclick = () => { restoreInput.value = ""; restoreInput.click(); };
  restoreInput.addEventListener("change", async () => {
    const f = restoreInput.files[0];
    if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      if (!Array.isArray(data.pages)) throw 0;
      data.pages = data.pages.filter(p => TEMPLATES[p.type]).map(p => ({ id: p.id || uid(), type: p.type, texts: p.texts || {}, photos: p.photos || {} }));
      state = upgrade({ v: 1, pages: data.pages.length ? data.pages : freshBook().pages });
      render(); save(); toast("Cadangan berhasil dibuka.");
    } catch { toast("File cadangan tidak valid."); }
  });

  // A handful of hearts and sparkles fly out of an element.
  function burst(el) {
    if (!el || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const r = el.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    for (let n = 0; n < 10; n++) {
      const b = document.createElement("span");
      b.className = "burst";
      b.textContent = n % 3 ? "♥" : "✦";
      const a = (n / 10) * Math.PI * 2 + Math.random() * .5, d = 50 + Math.random() * 60;
      b.style.cssText = `left:${cx}px;top:${cy}px;--dx:${Math.cos(a) * d}px;--dy:${Math.sin(a) * d}px;--rz:${(Math.random() * 80 - 40) | 0}deg;font-size:${14 + Math.random() * 12}px`;
      document.body.appendChild(b);
      setTimeout(() => b.remove(), 1100);
    }
  }

  let toastTimer;
  function toast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2800);
  }

  /* ================= Boot ================= */
  /* ================= Sharing the finished book ================= */
  // Only text formatting the editor itself produces survives; everything else becomes plain text.
  function cleanHTML(html) {
    const t = document.createElement("template");
    t.innerHTML = String(html ?? "");
    const walk = node => [...node.childNodes].forEach(c => {
      if (c.nodeType === 1) {
        if (!/^(BR|B|I|EM|STRONG|DIV|SPAN|P)$/.test(c.tagName)) { c.replaceWith(document.createTextNode(c.textContent)); return; }
        [...c.attributes].forEach(a => c.removeAttribute(a.name));
        walk(c);
      } else if (c.nodeType !== 3) c.remove();
    });
    walk(t.content);
    return t.innerHTML;
  }
  const okSrc = src => typeof src === "string" && (src.startsWith("/_blob/") || src.startsWith("data:image/"));
  function cleanBook(b) {
    const pages = (Array.isArray(b && b.pages) ? b.pages : []).filter(p => p && TEMPLATES[p.type]).map(p => {
      const texts = {}, photos = {};
      for (const k in (p.texts || {})) texts[k] = cleanHTML(p.texts[k]);
      for (const k in (p.photos || {})) {
        const ph = p.photos[k];
        if (ph && okSrc(ph.src)) photos[k] = { src: ph.src, x: clamp(+ph.x || 50, 0, 100), y: clamp(+ph.y || 50, 0, 100) };
      }
      return { id: String(p.id || uid()), type: p.type, texts, photos };
    });
    return { v: 1, pages };
  }

  let SHARED = null;
  try { SHARED = JSON.parse(document.getElementById("sharedBook").textContent); } catch { SHARED = null; }
  if (SHARED) SHARED = cleanBook(SHARED);
  if (SHARED && !SHARED.pages.length) SHARED = null;

  const use = name => (window.claude && typeof window.claude.use === "function" ? window.claude.use(name).catch(() => null) : Promise.resolve(null));

  const envelope = document.getElementById("envelope");
  document.getElementById("btnOpen").onclick = () => {
    envelope.classList.add("opening");
    burst(document.querySelector(".env-card"));
    setTimeout(() => { envelope.hidden = true; envelope.classList.remove("opening"); }, 800);
  };

  // Owner preview of the finished book, built from this device's copy.
  const btnBackEdit = document.getElementById("btnBackEdit");
  document.getElementById("btnPreview").onclick = () => {
    viewBook = state; setMode("view"); btnBackEdit.hidden = false; window.scrollTo(0, 0);
  };
  btnBackEdit.onclick = () => { btnBackEdit.hidden = true; setMode("edit"); window.scrollTo(0, 0); };

  function dataURLtoBlob(url) {
    const [head, body] = url.split(",");
    const type = (head.match(/data:([^;]+)/) || [])[1] || "image/jpeg";
    const bin = atob(body), arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return new Blob([arr], { type });
  }

  // The page saves itself as a new version with the shared book embedded as data.
  function buildDoc(shared) {
    const json = JSON.stringify(shared).replace(/</g, "\\u003c");
    return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'
      + RESET + '</style></head><body>' + PAGE_HEAD
      + '<script type="application/json" id="sharedBook">' + json + '<\/script>'
      + '<script id="app">' + SRC + '<\/script></body></html>';
  }

  const btnShare = document.getElementById("btnShare");
  btnShare.onclick = async () => {
    const [artifact, assets] = await Promise.all([use("artifact"), use("assets")]);
    if (!artifact || !assets || !SRC) { toast("Berbagi belum bisa dilakukan dari sini."); return; }
    btnShare.disabled = true;
    try {
      const todo = [];
      state.pages.forEach(p => Object.values(p.photos).forEach(ph => { if (ph && !ph.asset && !String(ph.src).startsWith("/_blob/")) todo.push(ph); }));
      for (let n = 0; n < todo.length; n++) {
        toast(`Menyiapkan foto ${n + 1} dari ${todo.length}…`);
        const r = await assets.upload(dataURLtoBlob(todo[n].src));
        todo[n].asset = "/_blob/" + r.id;
        save();
      }
      const shared = cleanBook({ pages: state.pages.map(p => ({
        id: p.id, type: p.type, texts: p.texts,
        photos: Object.fromEntries(Object.entries(p.photos).map(([k, ph]) => [k, { src: ph.asset || ph.src, x: ph.x, y: ph.y }]))
      })) });
      // Photos still held only on this device (if any) are left out rather than embedded.
      shared.pages.forEach(p => { for (const k in p.photos) if (!p.photos[k].src.startsWith("/_blob/")) delete p.photos[k]; });
      shared.sharedAt = Date.now();
      try { sessionStorage.setItem("bou-just-shared", "1"); } catch {}
      toast("Membungkus buku untukmu berdua…");
      await artifact.publish(buildDoc(shared)); // every open view, this one included, reloads to the new version
    } catch (e) {
      try { sessionStorage.removeItem("bou-just-shared"); } catch {}
      const code = e && e.code;
      if (code === "conflict") return;
      if (code === "not_writer" || code === "not_granted" || code === "consent_required" || code === "capability_disabled") toast("Hanya pemilik buku yang bisa membagikannya.");
      else if (code === "too_large" || code === "quota_or_state") toast("Bukunya terlalu besar untuk dibagikan. Coba kurangi beberapa foto.");
      else if (code === "rate_limited") toast("Tunggu sebentar, lalu coba bagikan lagi.");
      else toast("Bukunya belum berhasil dibagikan. Coba lagi sebentar lagi.");
    } finally {
      btnShare.disabled = false;
    }
  };

  const shareModal = document.getElementById("shareModal");
  const shareLink = document.getElementById("shareLink");
  shareLink.value = SHARE_URL;
  document.getElementById("shareClose").onclick = () => shareModal.classList.remove("open");
  document.getElementById("btnCopy").onclick = () => {
    const done = () => toast("Link disalin ♡");
    const fallback = () => { shareLink.focus(); shareLink.select(); };
    try { navigator.clipboard.writeText(SHARE_URL).then(done, fallback); } catch { fallback(); }
  };

  /* ================= Boot ================= */
  book.classList.add("intro");
  if (SHARED) { viewBook = SHARED; envelope.hidden = false; setMode("view"); }
  else render();

  let justShared = false;
  try { justShared = sessionStorage.getItem("bou-just-shared") === "1"; sessionStorage.removeItem("bou-just-shared"); } catch {}

  load().then(saved => {
    if (saved && Array.isArray(saved.pages) && saved.pages.length) state = upgrade(saved);
    else if (SHARED) state = upgrade(JSON.parse(JSON.stringify(SHARED)));
    if (mode === "edit") render();
    setTimeout(() => book.classList.remove("intro"), 1500);
  });

  // People who can edit this book get the editor; everyone else keeps the finished book.
  use("user").then(async u => {
    let canEdit = false;
    try { canEdit = u ? await u.canEdit() : false; } catch { canEdit = false; }
    if (!canEdit) return;
    if (mode === "view" && btnBackEdit.hidden) { envelope.hidden = true; setMode("edit"); }
    const [artifact, assets] = await Promise.all([use("artifact"), use("assets")]);
    if (artifact && assets && SRC) btnShare.hidden = false;
    if (justShared) shareModal.classList.add("open");
  });
})();
</script>
<!--/page-->
</body>
</html>
